<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinic-Software-Hub &mdash; Administration</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root {
    --bg: #eef3f7;
    --panel: #ffffff;
    --panel-border: #dde5ec;
    --text: #333333;
    --text-dim: #666666;
    --primary: #00acdb;
    --primary-hover: #0090b8;
    --up: #32893a;
    --down: #d33333;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .top-controls {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
  }
  .field-with-help {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .help-icon {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: help;
    user-select: none;
  }
  .top-controls input {
    width: 100%;
    padding: 0.5rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--panel-border);
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.8rem;
  }

  header {
    text-align: center;
    padding: 1.5rem 1rem 0.25rem;
  }
  header h1 { margin: 0 0 0.4rem; font-size: 1.5rem; font-weight: 600; }
  header p { margin: 0; color: var(--text-dim); }

  a.button {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    border-radius: 6px;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
  }
  a.button:hover { background: var(--primary-hover); }

  main { max-width: 920px; margin: 0 auto; padding: 0 1rem 4rem; }

  h2.section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    font-weight: 600;
    margin: 0.5rem 0 0.75rem;
  }

  #workflowList {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem;
  }
  @media (max-width: 640px) {
    #workflowList { grid-template-columns: 1fr; }
  }

  .workflow-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    box-shadow: 0 1px 3px rgba(40, 53, 147, 0.06);
  }
  .workflow-card h3 {
    margin: 0 0 0.75rem;
    font-size: 1rem;
    cursor: help;
    display: inline-block;
    border-bottom: 1px dotted #b8c2cc;
  }

  .status-card {
    text-align: center;
  }
  .status-card h3 {
    cursor: default;
    border-bottom: none;
    display: block;
  }
  .workflow-card .field { margin-bottom: 0.6rem; }
  .workflow-card label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.25rem; }
  .workflow-card input[type="text"] {
    width: 100%;
    padding: 0.5rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--panel-border);
    background: var(--bg);
    color: var(--text);
  }
  .workflow-card .checkbox-field { display: flex; align-items: center; gap: 0.5rem; }
  .workflow-card .checkbox-field label { margin: 0; }
  .workflow-card .actions { display: flex; gap: 0.75rem; align-items: center; margin-top: 0.75rem; flex-wrap: wrap; }
  .workflow-card button.run {
    background: var(--up);
    color: #fff;
    border: none;
    padding: 0.55rem 1.1rem;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }
  .workflow-card button.run:disabled { background: var(--text-dim); cursor: not-allowed; }
  .workflow-card a.manual-link { color: var(--primary); font-size: 0.85rem; text-decoration: none; }
  .workflow-card a.manual-link:hover { color: var(--primary-hover); text-decoration: underline; }
  .workflow-card .result { font-size: 0.85rem; margin-top: 0.5rem; }
  .workflow-card .result.ok { color: var(--up); }
  .workflow-card .result.err { color: var(--down); }

  footer.build-info {
    text-align: center;
    margin-top: 2rem;
    padding-bottom: 2.5rem;
    color: var(--text-dim);
    font-size: 0.75rem;
  }
  footer.build-info a { color: var(--text-dim); }
  footer.build-info a:hover { color: var(--primary); }
</style>
</head>
<body>

<header>
  <h1>Clinic-Software-Hub</h1>
  <p>Administration of tenants and shared infrastructure</p>
</header>

<main>
  <h2 class="section-title">Runtime Actions</h2>
  <div id="workflowList">
    <div class="top-controls workflow-card">
      <div class="field-with-help">
        <input type="password" id="patInput" placeholder="GitHub PAT" autocomplete="off">
        <span class="help-icon" title="Create one at github.com &#8594; Settings &#8594; Developer settings &#8594; Personal access tokens &#8594; Fine-grained tokens &#8594; Generate new token. Scope it to the Clinic-Software-Hub/clinicsoftwarehub repository only, with Actions permission set to Read and write.">?</span>
      </div>
      <div class="field-with-help">
        <input type="text" id="envInput" placeholder="GitHub environment name" autocomplete="off">
        <span class="help-icon" title="Find it in the clinicsoftwarehub repo under Settings &#8594; Environments. Use the exact environment name shown there (e.g. production).">?</span>
      </div>
      <input type="text" id="branchInput" placeholder="Branch (default: main)" autocomplete="off">
    </div>

    <div class="workflow-card status-card">
      <h3>Status Dashboard</h3>
      <a class="button" href="https://clinicsoftwarehub.online/status.html" target="_blank" rel="noopener noreferrer">View Status Dashboard</a>
    </div>
  </div>
  <datalist id="tenantIdList"></datalist>
</main>

<footer class="build-info" id="buildInfo">Loading version…</footer>

<script>
(function () {
  "use strict";

  var OWNER = "Clinic-Software-Hub";
  var REPO = "clinicsoftwarehub";
  var DEFAULT_REF = "main";
  var STATUS_JSON_URL = "https://clinicsoftwarehub.online/status.json";

  // This site's own repo (distinct from OWNER/REPO above, which is the
  // separate repo holding the runtime-*.yml workflows this page dispatches).
  // Used only to show the deployed commit/timestamp in the footer.
  var PAGES_REPO = "Clinic-Software-Hub/Clinic-Software-Hub.github.io";

  var PAT_KEY = "csh_gh_pat";
  var ENV_KEY = "csh_gh_env";
  var BRANCH_KEY = "csh_gh_branch";

  // GitHub can take noticeably longer than a few seconds between accepting
  // a workflow_dispatch call and the resulting run actually showing up in
  // the runs list (worse if another runtime-*.yml run is already occupying
  // the "global-deployment" concurrency group), so this window is generous
  // on purpose.
  var POLL_INTERVAL_MS = 2000;
  var POLL_MAX_ATTEMPTS = 25;

  var WORKFLOWS = [
    {
      file: "runtime-start-tenant.yml",
      title: "Start tenant",
      desc: "Starts a specific tenant's stack; optionally (re)creates and seeds it first.",
      envKey: "enviroment",
      inputs: [
        { name: "tenant_id", label: "Tenant ID", type: "text", required: true, datalist: "tenantIdList" },
        { name: "create-tenant", label: "(Re)create the tenant before starting", type: "checkbox", default: true },
        { name: "seed_boxzero_data", label: "Seed BoxZero demo data", type: "checkbox", default: false }
      ]
    },
    {
      file: "runtime-stop-tenant.yml",
      title: "Stop tenant",
      desc: "Stops a specific tenant's stack.",
      envKey: "enviroment",
      inputs: [
        { name: "tenant_id", label: "Tenant ID", type: "text", required: true, datalist: "tenantIdList" }
      ]
    },
    {
      file: "runtime-manage-mongoku.yml",
      title: "Manage Mongoku",
      desc: "Starts or stops a specific tenant's Mongoku (DB admin UI) instance only.",
      envKey: "enviroment",
      inputs: [
        { name: "tenant_id", label: "Tenant ID", type: "text", required: true, datalist: "tenantIdList" },
        { name: "start-stop", label: "Checked = start Mongoku, unchecked = stop Mongoku", type: "checkbox", default: true }
      ]
    },
    {
      file: "runtime-offboard-tenant.yml",
      title: "Offboard tenant",
      desc: "Stops a tenant, archives its whole directory, then deletes the live copy. Destructive on the live directory (recoverable from the archive).",
      envKey: "enviroment",
      inputs: [
        { name: "tenant_id", label: "Tenant ID to stop, archive and remove", type: "text", required: true, datalist: "tenantIdList" }
      ]
    },
    {
      file: "runtime-prepare-vps.yml",
      title: "Prepare new VPS",
      desc: "Full VPS bootstrap: pulls clinicsoftwarehub-init, deploys scripts/ to the VPS, optionally registers DNS/SSL, provisions and starts a default tenant.",
      envKey: "enviroment",
      inputs: [
        { name: "register_dns", label: "Register DNS for this VPS", type: "checkbox", default: false },
        { name: "create_ssl_cert", label: "Create SSL certificate for this DNS/VPS pair", type: "checkbox", default: false }
      ]
    },
    {
      file: "runtime-refresh-deploy-scripts.yml",
      title: "Refresh deploy scripts",
      desc: "Re-deploys just the scripts/ directory and credentials to an existing VPS.",
      envKey: "enviroment",
      inputs: []
    },
    {
      type: "sequence",
      title: "Restart Nginx + Dozzle",
      desc: "Stops the shared Nginx ingress and Dozzle log viewer, waits a few seconds, then starts them again.",
      envKey: "enviroment",
      delayMs: 5000,
      steps: [
        { file: "runtime-stop-nginx-dozzle.yml", label: "Stop Nginx + Dozzle" },
        { file: "runtime-start-nginx-dozzle.yml", label: "Start Nginx + Dozzle" }
      ]
    },
    {
      file: "runtime-bootstrap-github-environment.yml",
      title: "Bootstrap GitHub environment",
      desc: "Creates a new GitHub Environment with placeholder vars/secrets for a new deployment target.",
      envKey: "environment_name",
      inputs: []
    }
  ];

  function bindPersisted(id, storageKey) {
    var el = document.getElementById(id);
    var stored = sessionStorage.getItem(storageKey);
    if (stored) el.value = stored;
    el.addEventListener("input", function () {
      var v = el.value.trim();
      if (v) sessionStorage.setItem(storageKey, v);
      else sessionStorage.removeItem(storageKey);
    });
    return el;
  }

  var patEl = bindPersisted("patInput", PAT_KEY);
  var envEl = bindPersisted("envInput", ENV_KEY);
  var branchEl = bindPersisted("branchInput", BRANCH_KEY);

  // status.json is public and unauthenticated, so this doesn't need the PAT.
  // If it's unreachable -- most likely blocked by CORS since the VPS nginx
  // config doesn't currently send Access-Control-Allow-Origin for a
  // cross-origin GitHub Pages request, but also network errors, non-2xx, or
  // malformed JSON -- the datalist just stays empty and the tenant_id inputs
  // silently fall back to plain free-text fields.
  function populateTenantIdList() {
    fetch(STATUS_JSON_URL).then(function (res) {
      if (!res.ok) throw new Error("status " + res.status);
      return res.json();
    }).then(function (data) {
      var tenants = data && Array.isArray(data.tenants) ? data.tenants : [];
      var ids = tenants.map(function (t) {
        return t && t.tenant_id;
      }).filter(function (id) {
        return typeof id === "string" && id;
      });
      ids = ids.filter(function (id, i) {
        return ids.indexOf(id) === i;
      });
      ids.sort();

      var datalist = document.getElementById("tenantIdList");
      ids.forEach(function (id) {
        var opt = document.createElement("option");
        opt.value = id;
        datalist.appendChild(opt);
      });
    }).catch(function (err) {
      console.warn("Could not load tenant IDs from " + STATUS_JSON_URL + ":", err);
    });
  }

  // Shows the currently-deployed commit in the footer by asking GitHub for
  // the latest commit on this repo's main branch, rather than baking a
  // version string in at edit time (which drifts the moment anyone forgets
  // to bump it). Public/unauthenticated, same as populateTenantIdList above;
  // on any failure the footer just says so instead of showing stale info.
  function populateBuildInfo() {
    var footer = document.getElementById("buildInfo");
    fetch("https://api.github.com/repos/" + PAGES_REPO + "/commits/" + DEFAULT_REF, {
      headers: { "Accept": "application/vnd.github+json" }
    }).then(function (res) {
      if (!res.ok) throw new Error("status " + res.status);
      return res.json();
    }).then(function (commit) {
      var sha = commit && commit.sha;
      var date = commit && commit.commit && commit.commit.committer && commit.commit.committer.date;
      if (!sha || !date) throw new Error("malformed response");

      var shortSha = sha.slice(0, 7);
      var stamp = new Date(date).toISOString().replace("T", " ").replace(/\.\d+Z$/, " UTC");

      footer.textContent = "";
      var link = document.createElement("a");
      link.href = "https://github.com/" + PAGES_REPO + "/commit/" + sha;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = shortSha;
      footer.appendChild(document.createTextNode("Version "));
      footer.appendChild(link);
      footer.appendChild(document.createTextNode(" · deployed " + stamp));
    }).catch(function (err) {
      footer.textContent = "Version info unavailable";
      console.warn("Could not load build info from GitHub:", err);
    });
  }

  function ghHeaders(token) {
    return {
      "Authorization": "Bearer " + token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
  }

  function writeLoadingTab(tab) {
    if (!tab) return;
    tab.document.title = "Dispatching…";
    tab.document.body.style.margin = "0";
    var p = tab.document.createElement("p");
    p.textContent = "Waiting for the workflow run to appear on GitHub…";
    p.style.cssText = "font-family:sans-serif;background:#eef3f7;color:#333333;padding:2rem;margin:0;min-height:100vh;box-sizing:border-box;";
    tab.document.body.appendChild(p);
  }

  var LOG_POLL_MS = 4000;
  var ANSI_RE = /\x1b\[[0-9;]*m/g;

  function stripAnsi(s) {
    return s.replace(ANSI_RE, "");
  }

  // Polls a run + its jobs' raw logs until the run completes, rendering
  // status into `statusText` and per-job logs into `jobsContainer` (both
  // elements already attached to `tab`'s document). Shared by the
  // single-workflow and multi-step sequence log views below. The
  // jobs/{id}/logs endpoint redirects to a signed blob-storage URL that
  // doesn't always send CORS headers back to arbitrary origins -- if that
  // fetch fails, we show a message pointing at the "Open in GitHub
  // Actions" link instead of failing silently.
  // `onUpdate`, if given, is called with the run object on every poll so
  // callers outside the log tab (e.g. the card's own result text, which
  // otherwise stays frozen on "Streaming logs..." forever) can reflect
  // the run's actual status/conclusion once it's known.
  function pollRunLogs(tab, runId, token, statusText, jobsContainer, onUpdate) {
    function renderJobs(jobs, results) {
      jobsContainer.textContent = "";
      results.forEach(function (r) {
        var jobBlock = tab.document.createElement("div");
        jobBlock.style.marginBottom = "1.5rem";

        var jobTitle = tab.document.createElement("div");
        jobTitle.textContent = r.job.name + " — " + r.job.status + (r.job.conclusion ? " (" + r.job.conclusion + ")" : "");
        jobTitle.style.cssText = "font-weight:600;margin-bottom:0.5rem;";
        jobBlock.appendChild(jobTitle);

        var pre = tab.document.createElement("pre");
        pre.style.cssText = "background:#ffffff;border:1px solid #dde5ec;border-radius:8px;padding:1rem;overflow:auto;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin:0;";
        if (r.log !== null) {
          pre.textContent = stripAnsi(r.log) || "(empty log so far)";
        } else if (r.job.status !== "completed") {
          pre.textContent = "Waiting for this job to start...";
        } else {
          pre.textContent = "Could not load logs for this job (possibly blocked by the log storage's CORS policy). Use \"Open in GitHub Actions\" above to view them there.";
        }
        jobBlock.appendChild(pre);

        jobsContainer.appendChild(jobBlock);
      });
    }

    function poll() {
      if (tab.closed) return;
      fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/actions/runs/" + runId, {
        headers: ghHeaders(token)
      }).then(function (res) { return res.json(); }).then(function (run) {
        if (tab.closed) return;
        statusText.textContent = "Status: " + run.status + (run.conclusion ? " (" + run.conclusion + ")" : "");
        if (onUpdate) onUpdate(run);

        return fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/actions/runs/" + runId + "/jobs", {
          headers: ghHeaders(token)
        }).then(function (res) { return res.json(); }).then(function (data) {
          if (tab.closed) return;
          var jobs = (data && data.jobs) || [];
          return Promise.all(jobs.map(function (job) {
            return fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/actions/jobs/" + job.id + "/logs", {
              headers: ghHeaders(token)
            }).then(function (r) {
              if (!r.ok) return { job: job, log: null };
              return r.text().then(function (t) { return { job: job, log: t }; });
            }).catch(function () {
              return { job: job, log: null };
            });
          })).then(function (results) {
            if (tab.closed) return;
            renderJobs(jobs, results);
            if (run.status !== "completed") {
              setTimeout(poll, LOG_POLL_MS);
            }
          });
        });
      }).catch(function (err) {
        if (tab.closed) return;
        statusText.textContent = "Error loading run: " + err.message;
        setTimeout(poll, LOG_POLL_MS);
      });
    }

    poll();
  }

  // Renders a live-ish log view for a single run directly in `tab`.
  // `onUpdate`, if given, is forwarded to pollRunLogs (see its comment).
  function renderLogsInTab(tab, runId, token, htmlUrl, onUpdate) {
    if (!tab) return;
    tab.document.title = "Run logs";
    tab.document.body.style.margin = "0";
    tab.document.body.style.background = "#eef3f7";
    tab.document.body.style.color = "#333333";
    tab.document.body.style.fontFamily = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    tab.document.body.textContent = "";

    var wrap = tab.document.createElement("div");
    wrap.style.cssText = "padding:1rem 1.5rem 3rem;max-width:1100px;margin:0 auto;box-sizing:border-box;";

    var topBar = tab.document.createElement("div");
    topBar.style.cssText = "display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:1rem;";

    var statusText = tab.document.createElement("span");
    statusText.textContent = "Loading run...";
    statusText.style.fontWeight = "600";
    topBar.appendChild(statusText);

    var ghLink = tab.document.createElement("a");
    ghLink.href = htmlUrl;
    ghLink.target = "_blank";
    ghLink.rel = "noopener noreferrer";
    ghLink.textContent = "Open in GitHub Actions";
    ghLink.style.color = "#00acdb";
    topBar.appendChild(ghLink);

    wrap.appendChild(topBar);

    var jobsContainer = tab.document.createElement("div");
    wrap.appendChild(jobsContainer);

    tab.document.body.appendChild(wrap);

    pollRunLogs(tab, runId, token, statusText, jobsContainer, onUpdate);
  }

  // Builds one step's status/link/logs section inside a sequence tab and
  // returns its live elements.
  function buildStepSection(tab, container, index, label) {
    var section = tab.document.createElement("div");
    section.style.cssText = "margin-bottom:1.5rem;padding-bottom:1.5rem;" +
      (index > 0 ? "border-top:1px solid #dde5ec;padding-top:1.5rem;" : "");

    var heading = tab.document.createElement("div");
    heading.textContent = "Step " + (index + 1) + ": " + label;
    heading.style.cssText = "font-size:1.05rem;font-weight:700;margin-bottom:0.5rem;";
    section.appendChild(heading);

    var topBar = tab.document.createElement("div");
    topBar.style.cssText = "display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;gap:1rem;";

    var statusText = tab.document.createElement("span");
    statusText.textContent = "Waiting to start...";
    statusText.style.fontWeight = "600";
    topBar.appendChild(statusText);

    var linkHolder = tab.document.createElement("span");
    topBar.appendChild(linkHolder);

    section.appendChild(topBar);

    var jobsContainer = tab.document.createElement("div");
    section.appendChild(jobsContainer);

    container.appendChild(section);

    return { statusText: statusText, linkHolder: linkHolder, jobsContainer: jobsContainer };
  }

  // Lays out a section per step of `seq` in `tab` and returns their live
  // elements, so both steps' status/logs are visible in the same tab.
  function writeSequenceTab(tab, seq) {
    tab.document.title = seq.title;
    tab.document.body.style.margin = "0";
    tab.document.body.style.background = "#eef3f7";
    tab.document.body.style.color = "#333333";
    tab.document.body.style.fontFamily = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    tab.document.body.textContent = "";

    var wrap = tab.document.createElement("div");
    wrap.style.cssText = "padding:1rem 1.5rem 3rem;max-width:1100px;margin:0 auto;box-sizing:border-box;";

    var h1 = tab.document.createElement("div");
    h1.textContent = seq.title;
    h1.style.cssText = "font-size:1.3rem;font-weight:700;margin-bottom:1rem;";
    wrap.appendChild(h1);

    var sections = seq.steps.map(function (step, i) {
      return buildStepSection(tab, wrap, i, step.label);
    });

    tab.document.body.appendChild(wrap);
    return sections;
  }

  // workflow_dispatch's API response carries no run id, so we poll the
  // workflow's runs list right after dispatching and grab the newest run
  // created at/after the dispatch time.
  function findNewRun(wf, token, sinceMs, attempt, onDone, onProgress) {
    if (onProgress) onProgress(attempt);
    fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/actions/workflows/" + wf.file + "/runs?event=workflow_dispatch&per_page=5", {
      headers: ghHeaders(token)
    }).then(function (res) { return res.json(); }).then(function (data) {
      var runs = (data && data.workflow_runs) || [];
      var match = runs.find(function (r) {
        return new Date(r.created_at).getTime() >= sinceMs - 10000;
      });
      if (match) {
        onDone(match);
      } else if (attempt < POLL_MAX_ATTEMPTS) {
        setTimeout(function () { findNewRun(wf, token, sinceMs, attempt + 1, onDone, onProgress); }, POLL_INTERVAL_MS);
      } else {
        onDone(null);
      }
    }).catch(function () {
      onDone(null);
    });
  }

  function buildCard(wf) {
    var card = document.createElement("div");
    card.className = "workflow-card";

    var h3 = document.createElement("h3");
    h3.textContent = wf.title;
    h3.title = wf.desc;
    card.appendChild(h3);

    var fieldEls = {};
    wf.inputs.forEach(function (inp) {
      var field = document.createElement("div");
      field.className = inp.type === "checkbox" ? "field checkbox-field" : "field";

      var label = document.createElement("label");
      label.textContent = inp.label + (inp.required ? " *" : "");

      var el = document.createElement("input");
      el.type = inp.type === "checkbox" ? "checkbox" : "text";
      if (inp.datalist) el.setAttribute("list", inp.datalist);
      el.id = wf.file + "__" + inp.name;
      if (inp.type === "checkbox") {
        el.checked = !!inp.default;
        field.appendChild(el);
        field.appendChild(label);
      } else {
        field.appendChild(label);
        field.appendChild(el);
      }

      card.appendChild(field);
      fieldEls[inp.name] = { el: el, type: inp.type, required: inp.required };
    });

    var actions = document.createElement("div");
    actions.className = "actions";

    var runBtn = document.createElement("button");
    runBtn.className = "run";
    runBtn.type = "button";
    runBtn.textContent = "Run";
    actions.appendChild(runBtn);

    var manualLink = document.createElement("a");
    manualLink.className = "manual-link";
    manualLink.href = "https://github.com/" + OWNER + "/" + REPO + "/actions/workflows/" + wf.file;
    manualLink.target = "_blank";
    manualLink.rel = "noopener noreferrer";
    manualLink.textContent = "Open in GitHub Actions instead";
    actions.appendChild(manualLink);

    card.appendChild(actions);

    var result = document.createElement("div");
    result.className = "result";
    card.appendChild(result);

    runBtn.addEventListener("click", function () {
      var token = patEl.value.trim();
      var envValue = envEl.value.trim();
      var branchValue = branchEl.value.trim() || DEFAULT_REF;

      if (!token) {
        result.className = "result err";
        result.textContent = "Paste a token in the top-left box first.";
        return;
      }
      if (!envValue) {
        result.className = "result err";
        result.textContent = "Fill in the GitHub environment name in the top-left box first.";
        return;
      }

      var inputsPayload = {};
      inputsPayload[wf.envKey] = envValue;

      var missing = [];
      Object.keys(fieldEls).forEach(function (name) {
        var f = fieldEls[name];
        if (f.type === "checkbox") {
          inputsPayload[name] = f.el.checked ? "true" : "false";
        } else {
          var v = f.el.value.trim();
          if (f.required && !v) missing.push(name);
          if (v) inputsPayload[name] = v;
        }
      });
      if (missing.length) {
        result.className = "result err";
        result.textContent = "Missing required field(s): " + missing.join(", ");
        return;
      }

      // Open the tab synchronously inside the click handler so browsers
      // don't treat it as a popup; we navigate it once we know the run URL.
      var logTab = window.open("", "_blank");
      writeLoadingTab(logTab);

      runBtn.disabled = true;
      result.className = "result";
      result.textContent = "Dispatching...";

      var dispatchTime = Date.now();

      fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/actions/workflows/" + wf.file + "/dispatches", {
        method: "POST",
        headers: Object.assign(ghHeaders(token), { "Content-Type": "application/json" }),
        body: JSON.stringify({ ref: branchValue, inputs: inputsPayload })
      }).then(function (res) {
        if (res.status === 204) {
          result.className = "result ok";
          result.textContent = "Dispatched on '" + branchValue + "'. Looking up the run...";
          findNewRun(wf, token, dispatchTime, 1, function (run) {
            runBtn.disabled = false;
            if (run) {
              result.textContent = "Dispatched on '" + branchValue + "'. Streaming logs in new tab.";
              renderLogsInTab(logTab, run.id, token, run.html_url, function (updatedRun) {
                if (updatedRun.status !== "completed") return;
                result.className = "result " + (updatedRun.conclusion === "success" ? "ok" : "err");
                result.textContent = "Run " + updatedRun.conclusion + " (" + branchValue + "). See the log tab for details.";
              });
            } else {
              result.textContent = "Dispatched on '" + branchValue + "', but couldn't find the run after " + (POLL_MAX_ATTEMPTS * POLL_INTERVAL_MS / 1000) + "s -- check the Actions tab.";
              if (logTab) logTab.location.href = "https://github.com/" + OWNER + "/" + REPO + "/actions/workflows/" + wf.file;
            }
          }, function (attempt) {
            result.textContent = "Dispatched on '" + branchValue + "'. Looking up the run... (" + Math.round((attempt - 1) * POLL_INTERVAL_MS / 1000) + "s)";
          });
          return null;
        }
        return res.json().then(function (body) {
          runBtn.disabled = false;
          result.className = "result err";
          result.textContent = "Failed (" + res.status + "): " + (body && body.message ? body.message : "unknown error");
          if (logTab) logTab.close();
        });
      }).catch(function (err) {
        runBtn.disabled = false;
        result.className = "result err";
        result.textContent = "Request failed: " + err.message;
        if (logTab) logTab.close();
      });
    });

    return card;
  }

  // Dispatches one step of a sequence and, once GitHub accepts it, looks up
  // and streams its run's logs into `sectionRefs` (may be null if the log
  // tab failed to open / was closed). Resolves once the dispatch call
  // itself has responded -- it does not wait for the run to finish, since
  // sequencing between steps is a fixed delay after dispatch, not a wait
  // for completion. `onRunUpdate`, if given, is forwarded to pollRunLogs
  // (see its comment) so a caller can reflect this step's eventual
  // completion outside the log tab.
  function dispatchStep(wf, token, envValue, branchValue, tab, sectionRefs, onRunUpdate) {
    function setStatus(text) {
      if (sectionRefs) sectionRefs.statusText.textContent = text;
    }

    setStatus("Dispatching...");

    var inputsPayload = {};
    inputsPayload[wf.envKey] = envValue;
    var dispatchTime = Date.now();

    return fetch("https://api.github.com/repos/" + OWNER + "/" + REPO + "/actions/workflows/" + wf.file + "/dispatches", {
      method: "POST",
      headers: Object.assign(ghHeaders(token), { "Content-Type": "application/json" }),
      body: JSON.stringify({ ref: branchValue, inputs: inputsPayload })
    }).then(function (res) {
      if (res.status === 204) {
        setStatus("Dispatched. Looking up the run...");
        findNewRun(wf, token, dispatchTime, 1, function (run) {
          if (tab && tab.closed) return;
          if (run) {
            if (sectionRefs) {
              var ghLink = tab.document.createElement("a");
              ghLink.href = run.html_url;
              ghLink.target = "_blank";
              ghLink.rel = "noopener noreferrer";
              ghLink.textContent = "Open in GitHub Actions";
              ghLink.style.color = "#00acdb";
              sectionRefs.linkHolder.appendChild(ghLink);
              pollRunLogs(tab, run.id, token, sectionRefs.statusText, sectionRefs.jobsContainer, onRunUpdate);
            }
          } else {
            setStatus("Dispatched, but couldn't find the run after " + (POLL_MAX_ATTEMPTS * POLL_INTERVAL_MS / 1000) + "s -- check the Actions tab.");
          }
        }, function (attempt) {
          if (tab && tab.closed) return;
          setStatus("Dispatched. Looking up the run... (" + Math.round((attempt - 1) * POLL_INTERVAL_MS / 1000) + "s)");
        });
        return { ok: true };
      }
      return res.json().then(function (body) {
        setStatus("Failed (" + res.status + "): " + (body && body.message ? body.message : "unknown error"));
        return { ok: false };
      });
    }).catch(function (err) {
      setStatus("Request failed: " + err.message);
      return { ok: false };
    });
  }

  // Builds a card that dispatches `seq.steps` in order, waiting `seq.delayMs`
  // between each dispatch. Both steps' status/logs render as sections in a
  // single shared tab.
  function buildSequenceCard(seq) {
    var card = document.createElement("div");
    card.className = "workflow-card";

    var h3 = document.createElement("h3");
    h3.textContent = seq.title;
    h3.title = seq.desc;
    card.appendChild(h3);

    var actions = document.createElement("div");
    actions.className = "actions";

    var runBtn = document.createElement("button");
    runBtn.className = "run";
    runBtn.type = "button";
    runBtn.textContent = "Run";
    actions.appendChild(runBtn);

    card.appendChild(actions);

    var result = document.createElement("div");
    result.className = "result";
    card.appendChild(result);

    runBtn.addEventListener("click", function () {
      var token = patEl.value.trim();
      var envValue = envEl.value.trim();
      var branchValue = branchEl.value.trim() || DEFAULT_REF;

      if (!token) {
        result.className = "result err";
        result.textContent = "Paste a token in the top-left box first.";
        return;
      }
      if (!envValue) {
        result.className = "result err";
        result.textContent = "Fill in the GitHub environment name in the top-left box first.";
        return;
      }

      // Open the tab synchronously inside the click handler so browsers
      // don't treat it as a popup.
      var logTab = window.open("", "_blank");
      var sections = logTab ? writeSequenceTab(logTab, seq) : seq.steps.map(function () { return null; });

      runBtn.disabled = true;
      result.className = "result";
      result.textContent = "Dispatching step 1 of " + seq.steps.length + "...";

      function runStep(i) {
        var step = seq.steps[i];
        var wf = { file: step.file, envKey: seq.envKey };
        var isLast = i === seq.steps.length - 1;
        var onRunUpdate = isLast ? function (updatedRun) {
          if (updatedRun.status !== "completed") return;
          result.className = "result " + (updatedRun.conclusion === "success" ? "ok" : "err");
          result.textContent = "Step " + (i + 1) + " (" + step.label + ") " + updatedRun.conclusion + ". See the log tab for details.";
        } : null;
        dispatchStep(wf, token, envValue, branchValue, logTab, sections[i], onRunUpdate).then(function (outcome) {
          if (!outcome || !outcome.ok) {
            runBtn.disabled = false;
            result.className = "result err";
            result.textContent = "Step " + (i + 1) + " (" + step.label + ") failed to dispatch -- see the log tab for details.";
            return;
          }
          if (isLast) {
            runBtn.disabled = false;
            result.className = "result ok";
            result.textContent = "Dispatched all " + seq.steps.length + " step(s). Streaming logs in new tab.";
            return;
          }
          result.textContent = "Step " + (i + 1) + " dispatched. Waiting " + Math.round(seq.delayMs / 1000) + "s before step " + (i + 2) + "...";
          setTimeout(function () { runStep(i + 1); }, seq.delayMs);
        });
      }

      runStep(0);
    });

    return card;
  }

  var list = document.getElementById("workflowList");
  WORKFLOWS.forEach(function (wf) {
    list.appendChild(wf.type === "sequence" ? buildSequenceCard(wf) : buildCard(wf));
  });
  populateTenantIdList();
  populateBuildInfo();
})();
</script>
</body>
